name: Build WanderWise Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "wanderwise-app/**"
      - ".github/workflows/build-android.yml"
  push:
    paths:
      - "wanderwise-app/**"
      - ".github/workflows/build-android.yml"
    branches:
      - "build/wanderwise-android-v2"

concurrency:
  group: wanderwise-android-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wanderwise-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Check Expo project
        run: npx expo-doctor
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanderwise-debug-apk
          path: wanderwise-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
