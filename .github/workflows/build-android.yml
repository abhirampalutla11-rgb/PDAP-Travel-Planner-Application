name: Build WanderWise Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "wanderwise-app/**"
      - ".github/workflows/build-android.yml"
    branches:
      - build/wanderwise-android-app

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wanderwise-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wanderwise-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Expo project
        run: npx expo-doctor

      - name: Build Android APK with EAS
        run: npx eas-cli build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
