name: Build WanderWise Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "wanderwise-app/**"
      - ".github/workflows/build-android.yml"
      - "supabase/**"
  push:
    paths:
      - "wanderwise-app/**"
      - ".github/workflows/build-android.yml"
    branches:
      - "build/wanderwise-android-v2"

concurrency:
  group: wanderwise-android-v3-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hmjtzyakidwtkzhhbgzd
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: wanderwise-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Repair Android NDK installation
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager was not found"; exit 1; fi
          rm -rf "$SDK_ROOT/ndk/27.1.12297006"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;27.1.12297006"
      - name: Install dependencies
        run: npm install
      - name: Generate WanderWise brand assets
        run: node scripts/generate-assets.cjs
      - name: Check Expo project
        run: npx expo-doctor
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir /tmp/wanderwise-export
      - name: Build installable preview APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanderwise-preview-apk
          path: wanderwise-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Firebase distribution is enabled automatically after the Firebase secrets are added.
      - name: Authenticate with Firebase
        if: ${{ env.FIREBASE_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Distribute APK through Firebase App Distribution
        if: ${{ env.FIREBASE_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        working-directory: .
        run: |
          npm install --global firebase-tools
          APK_PATH="wanderwise-app/android/app/build/outputs/apk/release/app-release.apk"
          if [ -n "$FIREBASE_TESTER_GROUPS" ]; then
            firebase appdistribution:distribute "$APK_PATH" --app "$FIREBASE_APP_ID" --release-notes "WanderWise Android preview build from GitHub Actions" --groups "$FIREBASE_TESTER_GROUPS"
          else
            firebase appdistribution:distribute "$APK_PATH" --app "$FIREBASE_APP_ID" --release-notes "WanderWise Android preview build from GitHub Actions"
          fi

      # Deploy the Gemini-backed companion only after its private credentials are configured.
      - name: Set up Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.GEMINI_API_KEY != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Configure Gemini secret and deploy AI function
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.GEMINI_API_KEY != '' }}
        working-directory: .
        run: |
          supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy wanderwise-ai --project-ref "$SUPABASE_PROJECT_REF"
